<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">

<meta name="edulab:title" content="閱讀素養">

<meta name="edulab:subject" content="國語">
<meta name="edulab:tags" content="閱讀理解,閱讀素養,注音,一年級,二年級,六年級,找資訊,推論,整合詮釋,評估反思,生詞,自然,科學,搞笑,文學">

<meta name="edulab:icon" content="📚">
<meta name="description" content="閱讀素養闖關：依年級分成 Lv1～Lv6，已開放一、二年級（全文注音）和六年級。選自然、科學、搞笑、文學喜歡的主題讀原創短文，生詞點一下就有解釋，讀完後原文縮到一半、另一半回答閱讀理解題。">
<title>閱讀素養</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* 版面：深色的復古遊戲機；文章本身用米色紙張，讀起來比較不累眼。故意只做一種夜色配色。 */
:root{
  --bg:#141a3a; --bg2:#0e1330; --panel:#20285a; --panel2:#2a3370; --line:#0b0e22;
  --text:#f4f1ff; --dim:#a9a6d6; --gold:#ffcf3f; --cyan:#3ce0ff; --pink:#ff5fa2; --green:#3ccf6e; --red:#ff5a5a;
  --u1:#ff6b6b; --u2:#ffb84d; --u3:#4dd2ff; --u4:#6be07a; --u5:#c48bff;
  --f:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --px:"Press Start 2P",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f);
  background-image:radial-gradient(circle at 20% 10%,rgba(60,224,255,.08),transparent 40%),radial-gradient(circle at 85% 80%,rgba(255,95,162,.08),transparent 40%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ---------- 上方 bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;text-shadow:3px 3px 0 var(--line)}
.logo .px{font-family:var(--px);font-size:10px;color:var(--gold)}
.me{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);padding:4px 10px}
.me .lv{font-family:var(--px);font-size:11px;color:var(--gold)}
.me .ttl{font-weight:900;font-size:14px}
.xpbar{width:90px;height:10px;background:var(--bg2);border:2px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-weight:900;font-size:14px;background:var(--panel2);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);padding:3px 10px}
.chip:active{transform:translateY(3px);box-shadow:none}
.chip[aria-pressed="false"]{opacity:.55}

/* ---------- 任務大廳 ---------- */
.hero{position:relative;background:var(--panel);border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35);overflow:hidden}
.hero canvas{display:block;width:100%;height:80px;image-rendering:pixelated}
.hero .txt{display:flex;flex-direction:column;gap:2px;padding:10px 16px 8px}
.hero h2{margin:0;font-size:clamp(22px,4vw,34px);font-weight:900;text-shadow:3px 3px 0 var(--line)}
.hero p{margin:0;font-weight:700;color:var(--gold);text-shadow:2px 2px 0 var(--line);font-size:14px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.unit{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:4px solid var(--line);box-shadow:0 6px 0 var(--line);padding:12px 14px 14px;border-top:8px solid var(--c)}
.unit:hover{background:var(--panel2)}
.unit:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.unit .top{display:flex;align-items:center;gap:10px}
.unit canvas{width:48px;height:48px;image-rendering:pixelated;flex:none}
.unit .no{font-family:var(--px);font-size:10px;color:var(--c)}
.unit h3{margin:2px 0 0;font-size:18px;line-height:1.3;font-weight:900;text-wrap:balance}
.unit ul{margin:0;padding-left:1.1em;color:var(--dim);font-size:13px;line-height:1.6}
.unit .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;font-weight:700;font-size:13px}
.stars{font-size:18px;letter-spacing:1px;color:var(--gold)}
.stars .off{color:#4a4f86}
.unit .go{font-family:var(--px);font-size:10px;background:var(--c);color:var(--line);padding:6px 8px;border:2px solid var(--line)}
.tipline{color:var(--dim);font-size:13px;text-align:center;margin:0}

/* ---------- 任務畫面 ---------- */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud .uname{font-weight:900;font-size:16px;color:var(--c)}
.dots{display:flex;gap:4px;flex:1;min-width:120px}
.dots i{flex:1;height:10px;background:var(--bg2);border:2px solid var(--line)}
.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}.dots i.now{background:var(--gold)}
.combo{font-family:var(--px);font-size:11px;color:var(--pink);min-width:84px;text-align:right}
.score{font-family:var(--px);font-size:11px;color:var(--gold)}
.scene{position:relative;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35);background:var(--bg2)}
.scene canvas{display:block;width:100%;height:72px;image-rendering:pixelated}
.scene.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.float{position:absolute;font-family:var(--px);font-size:14px;color:var(--gold);text-shadow:2px 2px 0 var(--line);pointer-events:none;animation:up 1.1s forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.bubble{position:relative;background:var(--text);color:var(--line);border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:12px 16px}
.bubble::before{content:"";position:absolute;left:34px;top:-16px;border:8px solid transparent;border-bottom-color:var(--line)}
.bubble .tag{display:inline-block;font-size:12px;font-weight:900;background:var(--c);color:var(--line);border:2px solid var(--line);padding:0 8px;margin-bottom:6px}
.bubble .kind{font-family:var(--px);font-size:9px;color:#6a5a9a;margin-left:6px}
.bubble .q{font-size:clamp(18px,2.6vw,22px);font-weight:900;line-height:1.55;margin:0;text-wrap:pretty}
.bubble .q em{font-style:normal;color:#d0204a;text-decoration:underline}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);padding:10px 12px;font-size:17px;font-weight:700;line-height:1.4;min-height:56px}
.opt .k{flex:none;font-family:var(--px);font-size:11px;width:26px;height:26px;display:grid;place-items:center;background:var(--bg2);color:var(--c);border:2px solid var(--line)}
.opt:hover:not(:disabled){background:var(--panel2)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:#1f6a3e;border-color:var(--green)}
.opt.no{background:#6a1f2e;border-color:var(--red)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
.tf{grid-template-columns:repeat(2,minmax(0,1fr))}
.tf .opt{justify-content:center;font-size:22px;font-weight:900;min-height:72px}
.order-pool,.order-line{display:flex;flex-wrap:wrap;gap:8px}
.order-line{min-height:56px;background:var(--bg2);border:3px dashed #4a4f86;padding:8px}
.order-line .ph{color:var(--dim);font-size:14px;align-self:center}
.chipq{background:var(--panel);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);padding:8px 12px;font-weight:700;font-size:16px}
.chipq .n{font-family:var(--px);font-size:10px;color:var(--gold);margin-right:6px}
.chipq.ok{border-color:var(--green)}.chipq.no{border-color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.btn{font-weight:900;font-size:17px;background:var(--gold);color:var(--line);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);padding:8px 18px}
.btn.alt{background:var(--panel2);color:var(--text)}
.btn.hint{background:var(--cyan)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.fb{background:var(--panel);border:3px solid var(--line);border-left:10px solid var(--green);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.fb.bad{border-left-color:var(--red)}
.fb .h{font-weight:900;font-size:18px}
.fb .x{color:var(--dim);font-size:15px;line-height:1.7}
.fb .x b{color:var(--gold)}
.newcard{font-family:var(--px);font-size:10px;color:var(--pink)}

/* ---------- 結算 ---------- */
.result{background:var(--panel);border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.rank{font-family:var(--px);font-size:64px;color:var(--gold);text-shadow:5px 5px 0 var(--line);line-height:1}
.result .stars{font-size:40px}
.result .sum{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-weight:700}
.result .sum b{font-family:var(--px);font-size:13px;color:var(--cyan)}
.lvup{font-family:var(--px);font-size:13px;color:var(--pink);animation:blink .6s steps(2) 6}
@keyframes blink{50%{opacity:0}}
.gotcards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.mixbtn{font-weight:900;font-size:17px;text-align:left;background:linear-gradient(90deg,var(--u1),var(--u2));color:var(--line);border:4px solid var(--line);box-shadow:0 6px 0 var(--line);padding:12px 16px}
.mixbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.unit .sub{margin:0;color:var(--dim);font-size:14px}
.fb .ref{font-size:14px;color:var(--dim);line-height:1.7}
.fb .ref b{color:var(--cyan)}
.fb .x .lab{display:inline-block;font-size:12px;font-weight:900;background:var(--gold);color:var(--line);padding:0 6px;margin-right:6px}
.review{background:var(--bg2);border:3px solid var(--line);padding:10px 14px;text-align:left;font-size:14px;line-height:1.8;width:100%;max-width:620px;color:var(--dim)}
.review b{color:var(--gold)}
.pets{display:flex;align-items:center;gap:6px}
.petrow{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:2px 0 5px}
.petrow::-webkit-scrollbar{display:none}
.petrow .pet{flex:none;scroll-snap-align:start}
.parr{flex:none;width:30px;align-self:stretch;margin-bottom:3px;background:var(--panel);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);color:var(--gold);font-size:13px;font-weight:900}
.parr[hidden]{display:block!important;visibility:hidden}
.parr:active{transform:translateY(3px);box-shadow:none}
@media (max-width:520px){.pets{flex-wrap:wrap}.pets .lab{flex-basis:100%}}
.pets .lab{font-weight:900;color:var(--gold);margin-right:4px}
.pet{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);padding:4px 6px;font-size:12px;font-weight:700;min-width:52px}
.pet canvas{width:36px;height:30px;image-rendering:pixelated}
.pet.on{background:var(--gold);color:var(--line)}
.pet:active{transform:translateY(3px);box-shadow:none}
.confetti{position:fixed;inset:0;z-index:40;pointer-events:none}
.lbwin,.lbbox{width:min(480px,100%);background:var(--panel);border:4px solid var(--line);box-shadow:8px 8px 0 rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.lbwin .head,.lbbox .head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--gold);color:var(--line);font-weight:900;font-size:18px}
.lbwin ul{margin:0;padding:0 18px;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:16px}
.lbwin li b{color:var(--gold)}
.lbwin .rk{margin-left:8px;font-family:var(--px);font-size:10px;color:var(--pink)}
.lbwin .nm{display:flex;flex-direction:column;gap:6px;padding:0 18px;font-weight:900}
.lbwin input{font:inherit;font-size:20px;font-weight:700;padding:8px 10px;border:3px solid var(--line);background:var(--text);color:var(--line)}
.lbwin .me2{display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--dim);font-size:14px}
.lbwin .me2 canvas,.lblist canvas{width:36px;height:30px;image-rendering:pixelated;flex:none}
.lbwin .err{margin:0 18px;color:var(--red);font-weight:700}
.lbwin .row,.lbbox .row{padding:0 14px}
.lbbox .x{background:none;border:0;font-size:18px;font-weight:900;color:var(--line)}
.lbbox .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px}
@media (max-width:520px){.lbbox .tabs{grid-template-columns:repeat(2,1fr)}}
.lbbox .tab{flex:1;min-width:0;font-weight:900;font-size:14px;background:var(--bg2);border:3px solid var(--line);padding:6px 4px;color:var(--dim)}
.lbbox .tab.on{background:var(--cyan);color:var(--line)}
.lbnote{padding:0 14px;color:var(--dim);font-size:13px}
.lbmsg{padding:10px 14px;margin:0;color:var(--dim);text-align:center}
.lblist{margin:0;padding:0 12px;list-style:none;display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto}
.lblist li{display:flex;align-items:center;gap:10px;background:var(--bg2);border:2px solid var(--line);padding:4px 10px;font-weight:700}
.lblist li.me{background:#3a3170;border-color:var(--gold)}
.lblist .no{width:28px;text-align:center;font-family:var(--px);font-size:11px;color:var(--gold)}
.lblist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lblist .v{font-family:var(--px);font-size:11px;color:var(--cyan);text-align:right;flex:none}
.lblist .v small{display:block;font-size:9px;color:var(--dim);margin-top:2px}
.lbupd{padding:0 14px;color:var(--cyan);font-size:13px;font-weight:700}

.cpick{position:relative;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.cpick select{appearance:none;-webkit-appearance:none;font:inherit;font-weight:900;color:var(--text);background:rgba(11,14,34,.55);border:3px solid var(--gold);padding:2px 38px 2px 10px;cursor:pointer;text-shadow:3px 3px 0 var(--line)}
.cpick select:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.cpick option{background:var(--panel);color:var(--text);text-shadow:none;font-size:18px}
.cpick span{position:absolute;right:10px;pointer-events:none;color:var(--gold);font-size:.7em}

.ledger{overflow-x:auto;margin-top:10px}
.ledger table{border-collapse:collapse;min-width:100%;font-size:15px;background:var(--bg2);border:3px solid var(--line)}
.ledger th{background:var(--panel2);color:var(--gold);padding:6px 10px;white-space:nowrap;border:2px solid var(--line)}
.ledger td{padding:6px 10px;border:2px solid var(--line);text-align:center;white-space:nowrap;color:var(--text)}
.ledger td.n{text-align:right;font-variant-numeric:tabular-nums}
.ledger td.ask{color:var(--pink);font-weight:900}
/* ---------- 閱讀素養 ---------- */
.lvtabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.lvt{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);padding:6px 4px}
.lvt b{font-family:var(--px);font-size:11px;color:var(--gold)}
.lvt span{font-size:12px;font-weight:700;color:var(--dim)}
.lvt.on{background:var(--gold)}
.lvt.on b,.lvt.on span{color:var(--line)}
.lvt:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.lvt:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
@media (max-width:520px){.lvtabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cath{margin:0;display:flex;align-items:center;gap:8px;color:var(--c);font-size:22px}
.cath canvas{width:36px;height:36px;image-rendering:pixelated}
.rdgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.art{min-width:0;background:#fbf6e8;color:#2a2438;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:18px 24px;font-size:19px;line-height:2;transition:font-size .5s,padding .5s,line-height .5s}
.art h2{margin:0 0 2px;font-size:1.3em;line-height:1.4;color:#1b1630;text-wrap:balance}
.ameta{font-size:13px;color:#7a6f8a;margin-bottom:10px;font-weight:700;line-height:1.5}
.art p{margin:0 0 .7em;text-indent:2em;border-radius:2px;transition:background .3s}
.gw{border-bottom:2px dashed #d0204a;cursor:help;outline:none}
.gw:hover,.gw:focus-visible{background:rgba(255,95,162,.18)}
.gw.seen{background:rgba(255,207,63,.35)}
.art mark.ev{background:#ffe066;color:inherit;padding:0 2px;box-shadow:0 0 0 2px #ffcf3f}
.art p.clue{background:rgba(60,224,255,.2);outline:3px dashed #3ca0d0;outline-offset:3px}
.rdgrid.split{grid-template-columns:repeat(2,minmax(0,1fr))}
.rdgrid.split .art{font-size:15px;line-height:1.85;padding:12px 16px;max-height:calc(100vh - 28px);overflow:auto;position:sticky;top:12px}
.quiz{display:flex;flex-direction:column;gap:12px;min-width:0}
.quiz .bubble .q{font-size:clamp(17px,2.2vw,20px)}
.opts.one{grid-template-columns:minmax(0,1fr)}
.hintnote{color:var(--dim);font-size:13px}
.gwdemo{border-bottom:2px dashed var(--pink);color:var(--text)}
@media (max-width:760px){
  .rdgrid.split{grid-template-columns:minmax(0,1fr)}
  .rdgrid.split .art{max-height:42vh;position:static}
  .art{font-size:18px;padding:14px 16px}
}
.gtip{position:absolute;z-index:30;max-width:min(300px,calc(100vw - 16px));background:var(--text);color:var(--line);border:3px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.4);padding:8px 12px;font-size:15px;line-height:1.6;font-weight:700}
.gtip b{display:block;color:#d0204a;font-size:16px}
.gtip::before{content:"";position:absolute;left:calc(var(--ax,20px) - 8px);top:-11px;border:8px solid transparent;border-top:0;border-bottom-color:var(--line)}
.gtip.up::before{top:auto;bottom:-11px;border:8px solid transparent;border-bottom:0;border-top-color:var(--line)}
.skills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sk{background:var(--bg2);border:3px solid var(--line);padding:6px 12px;display:flex;gap:8px;align-items:center;font-weight:700}
.sk span{font-family:var(--px);font-size:11px;color:var(--cyan)}
.sk.full span{color:var(--green)}
.card .from{margin-top:4px;font-size:12px;color:var(--cyan)}
.unit .no.zh{font-family:var(--f);font-size:13px;font-weight:900}
.soon{background:var(--panel);border:4px solid var(--line);box-shadow:0 6px 0 var(--line);padding:16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.soon b{font-size:18px;color:var(--gold)}
.soon span{color:var(--dim)}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const INK = '#0b0e22';

// ---------- 聲音 ----------
let AC = null, muted = false;
function audio(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e){ return null; } } if (AC.state === 'suspended') AC.resume(); return AC; }
function beep(f, d, type = 'square', v = .05, when = 0){
  if (muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
}
const SFX = {
  blip: () => beep(880, .05, 'square', .04),
  ok:   () => [659, 784, 1047].forEach((f, i) => beep(f, .1, 'square', .05, i * .07)),
  combo:() => [784, 988, 1175, 1568].forEach((f, i) => beep(f, .09, 'square', .05, i * .06)),
  no:   () => { beep(196, .14, 'sawtooth', .05); beep(147, .22, 'sawtooth', .05, .12); },
  win:  () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => beep(f, i === 6 ? .5 : .12, 'square', .05, i * .12)),
  page: () => beep(1200, .03, 'triangle', .04)
};

// ---------- 像素圖：把 emoji 縮成小像素圖，加一圈深色描邊 ----------
const SPR = {};
function sprite(e, n = 20){
  const key = e + n; if (SPR[key]) return SPR[key];
  const big = document.createElement('canvas'); big.width = big.height = 80;
  const bg = big.getContext('2d');
  bg.font = '50px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; bg.textAlign = 'center'; bg.textBaseline = 'middle';
  bg.fillText(e, 40, 43);
  const bd = bg.getImageData(0, 0, 80, 80).data;
  let x0 = 80, y0 = 80, x1 = -1, y1 = -1;
  for (let y = 0; y < 80; y++) for (let x = 0; x < 80; x++) if (bd[(y * 80 + x) * 4 + 3] > 40){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  if (x1 >= 0){ const w = x1 - x0 + 1, h = y1 - y0 + 1, sc = Math.min((n - 2) / w, (n - 2) / h); g.drawImage(big, x0, y0, w, h, 1 + (n - 2 - w * sc) / 2, 1 + (n - 2 - h * sc) / 2, w * sc, h * sc); }
  const id = g.getImageData(0, 0, n, n), d = id.data;
  for (let i = 3; i < d.length; i += 4) d[i] = d[i] < 110 ? 0 : 255;
  g.putImageData(id, 0, 0);
  const op = i => d[i * 4 + 3] > 0, edge = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){ const i = y * n + x; if (op(i)) continue; if ((x > 0 && op(i - 1)) || (x < n - 1 && op(i + 1)) || (y > 0 && op(i - n)) || (y < n - 1 && op(i + n))) edge.push(i); }
  g.fillStyle = INK; edge.forEach(i => g.fillRect(i % n, Math.floor(i / n), 1, 1));
  return (SPR[key] = c);
}

    C('eval', '作者在最後一段說「請放輕腳步」，主要是希望讀者怎麼做？', ['觀察時不要打擾牠們', '靠近一點幫牠們拍照', '冬天不要去海邊', '叫醒牠們起來覓食'], '牠們白天在休息，作者希望大家觀賞時保持安靜、不打擾。', '請放輕腳步，別打擾這些遠道而來的嬌客')
  ] },
{ id:'n3', lv:6, cat:'nature', icon:'🍂', title:'落葉去哪裡了？',
  p:[
    '秋天的校園裡，落葉一片一片飄下來。工友伯伯每天掃，第二天又鋪滿一地。你有沒有想過：森林裡沒有人打掃，為什麼落葉不會越堆越高，把整座森林淹沒呢？',
    '原來，森林的地面上有一支看不見的「清潔隊」。蚯蚓、馬陸和潮蟲會先把落葉咬成小碎片；接著，數不清的細菌和真菌，再把這些碎片慢慢分解，變成更小的物質。這些把生物遺體分解掉的生物，被稱為「分解者」。',
    '分解者工作的速度，和環境很有關係。在溫暖潮濕的熱帶雨林，一片落葉可能幾個月就消失了；在寒冷乾燥的高山上，同樣一片葉子，可能要好幾年才會分解完。',
    '落葉被分解後，並不是真的「不見了」。葉子裡原本含有的養分會回到土壤中，形成黑色、鬆軟、帶著泥土香氣的腐植質。樹木的根再把這些養分吸收回去，用來長出新的枝葉。到了下一個秋天，新長出的葉子又會落下，再次被分解。就這樣，養分在森林裡一圈又一圈地循環。',
    '所以，下次看到滿地落葉，別急著把它們全部當成垃圾。在學校的花圃或家裡的盆栽，把落葉留在土上，或者做成堆肥，就是請分解者幫忙，把落葉變回植物的營養。'
  ],
  gl:{ '馬陸':'身體分成很多節、有很多隻腳的小動物，常躲在落葉堆裡。', '真菌':'黴菌和菇類這一類的生物，不是植物也不是動物。', '分解':'把一個東西拆開，變成更小、更簡單的物質。', '遺體':'生物死後留下的身體；這裡也包括落葉等掉落的部分。', '腐植質':'落葉等被分解後形成的黑色物質，能讓土壤肥沃。', '循環':'繞了一圈又回到原點，一次又一次地重複。', '堆肥':'把落葉、果皮等堆起來，讓它們慢慢分解成肥料。' },
  qs:[
    C('info', '下列哪一種「不是」文章中提到的分解者？', ['樹木', '蚯蚓', '細菌', '真菌'], '第二段提到蚯蚓、馬陸、潮蟲、細菌和真菌；樹木是吸收養分的一方。', '這些把生物遺體分解掉的生物，被稱為「分解者」'),
    C('infer', '同樣一片落葉，在哪裡最可能最快被分解完？', ['溫暖潮濕的熱帶雨林', '寒冷乾燥的高山', '終年結冰的南極', '又乾又熱的沙漠'], '第三段：溫暖潮濕的地方分解得快，寒冷乾燥的地方分解得慢。', '在溫暖潮濕的熱帶雨林，一片落葉可能幾個月就消失了'),
    C('integ', '作者說落葉「並不是真的『不見了』」，意思是什麼？', ['落葉的養分回到土壤，又被樹木吸收利用', '落葉被風吹到別的地方去了', '落葉被工友伯伯掃走了', '落葉埋在土裡，永遠不會改變'], '落葉分解後，養分變成腐植質，又被樹根吸收，長出新葉。', '落葉被分解後，並不是真的「不見了」'),
    O('integ', '依照文章，把養分在森林裡循環的過程排出正確順序。', ['樹葉落到地上', '小動物把落葉咬碎', '細菌和真菌把碎片分解', '養分回到土壤', '樹根吸收養分、長出新葉'], '先咬碎、再分解、養分回到土壤，最後被樹根吸收，長出新葉，又會再落下。', '葉子裡原本含有的養分會回到土壤中'),
    C('eval', '作者寫這篇文章，最主要的目的是什麼？', ['說明落葉在森林中的作用，並建議大家善用落葉', '抱怨每天掃落葉很辛苦', '教大家怎麼種香菇', '說服大家把樹砍掉'], '文章先解釋分解和養分循環，最後建議把落葉留在土上或做成堆肥。', '別急著把它們全部當成垃圾')
  ] },

{ id:'s1', lv:6, cat:'sci', icon:'🌅', title:'天空為什麼是藍色的？',
  p:[
    '晴朗的白天，抬頭看見的天空是藍色的；可是到了傍晚，太陽附近的天空卻變成橘紅色。同一片天空，為什麼會換顏色呢？',
    '首先要知道，太陽光看起來是白色的，其實是由紅、橙、黃、綠、藍、紫等許多顏色的光混合而成。雨後的彩虹，就是陽光被小水滴分開之後，讓我們看見了這些顏色。',
    '陽光要穿過厚厚的大氣層，才能到達我們的眼睛。大氣中有數不清的空氣分子，它們會把光往四面八方彈開，這個現象叫做「散射」。不同顏色的光，被散射的程度不一樣：藍光、紫光這類波長比較短的光，最容易被散射；紅光、橙光的波長比較長，比較能直直地穿過去。於是，藍光被散射到整片天空，不管從哪個方向看過去，都有藍光進入我們的眼睛，天空就成了藍色。',
    '那為什麼天空不是紫色的呢？因為陽光中的紫光本來就比較少，再加上我們的眼睛對藍光比對紫光敏感，所以看起來是藍色。',
    '到了傍晚，太陽接近地平線，陽光要斜斜地穿過更厚的大氣，走更長的路。一路上，藍光早就被散射光了，剩下能抵達眼睛的，主要是紅光和橙光，於是夕陽和晚霞就染上了溫暖的顏色。'
  ],
  gl:{ '大氣層':'包圍在地球外面、厚厚的一層空氣。', '分子':'組成物質的極小粒子，眼睛看不見。', '散射':'光碰到微小的粒子後，往四面八方彈開。', '波長':'光像波浪一樣前進，一個波浪的長度就是波長。', '敏感':'感覺很靈敏，容易察覺到。', '地平線':'往遠方看時，天和地看起來相接的那條線。', '晚霞':'傍晚時天空中被夕陽染紅的雲彩。' },
  qs:[
    C('info', '根據文章，太陽光是由什麼組成的？', ['許多不同顏色的光混合而成', '只有白色的光', '只有藍色的光', '空氣分子'], '第二段：太陽光其實是由紅、橙、黃、綠、藍、紫等許多顏色的光混合而成。', '其實是由紅、橙、黃、綠、藍、紫等許多顏色的光混合而成'),
    C('info', '哪一種光最容易被空氣分子散射？', ['波長短的藍光和紫光', '波長長的紅光', '波長長的橙光', '每一種顏色都一樣'], '第三段：波長比較短的藍光、紫光最容易被散射。', '藍光、紫光這類波長比較短的光，最容易被散射'),
    C('infer', '傍晚太陽附近的天空變成橘紅色，主要原因是什麼？', ['陽光穿過的大氣變厚，藍光在路上已被散射掉', '太陽到了傍晚就變成紅色', '空氣在傍晚會變成紅色', '雲把大海的顏色反射上來'], '第五段：傍晚陽光走更長的路，藍光早被散射光，剩下紅光和橙光。', '一路上，藍光早就被散射光了'),
    C('infer', '如果地球沒有大氣層，白天的天空最可能是什麼樣子？', ['黑色的，因為沒有東西把光散射到整片天空', '比現在更藍', '一整天都是橘紅色', '變成彩虹的顏色'], '天空會是藍色，是因為空氣分子把藍光散射到四面八方；沒有大氣，就沒有散射光，天空會是黑的。', '藍光被散射到整片天空'),
    C('eval', '作者在第二段提到彩虹，主要的作用是什麼？', ['用大家熟悉的現象，證明陽光裡有很多種顏色', '完整說明彩虹是怎麼形成的', '換一個和天空無關的話題', '說明為什麼會下雨'], '用看得見的彩虹當例子，讓讀者相信白色的陽光其實含有多種顏色。', '雨後的彩虹，就是陽光被小水滴分開之後')
  ] },
{ id:'s2', lv:6, cat:'sci', icon:'🏺', title:'不插電的冰箱',
  p:[
    '炎熱的夏天，剛從游泳池上岸，風一吹，常讓人冷得打哆嗦。明明天氣很熱，為什麼會覺得冷呢？答案藏在一個常見的現象裡——蒸發。',
    '水從液體變成水蒸氣的時候，需要吸收熱量。皮膚上的水蒸發時，會帶走身體的熱，所以我們覺得涼。流汗也是同樣的道理：汗水蒸發，幫身體降溫。',
    '在非洲的奈及利亞，許多鄉村沒有穩定的電力，農民採收的蔬菜水果，常常放不到幾天就爛掉了。1990 年代，一位當地的老師想到利用蒸發的原理，推廣一種「罐中罐」冰箱：把一個小陶罐放進一個大陶罐裡，兩個罐子之間填滿濕沙，再蓋上一塊濕布。',
    '陶罐的表面有許多細小的孔，沙子裡的水會慢慢滲到大罐子的外側，再蒸發到空氣中，同時把罐子裡的熱一點一點帶走。只要每天補充水分，裡面的溫度就能比外面低上好幾度，蔬菜水果可以保存的時間也延長了好幾倍。',
    '不過，這種冰箱有它的限制。在空氣潮濕的地方，水分不容易蒸發，降溫的效果就會大打折扣，所以它最適合用在又熱又乾燥的地區。',
    '一個簡單的科學原理，加上兩個陶罐和一些沙子，就改變了許多家庭的生活。好的發明，不一定要複雜又昂貴。'
  ],
  gl:{ '打哆嗦':'身體因為冷或害怕而發抖。', '蒸發':'液體慢慢變成氣體散到空氣中。', '熱量':'物體所含的熱；吸收熱量會變熱，失去熱量會變冷。', '穩定':'沒有變動，可以一直依靠。', '推廣':'擴大範圍，讓更多人知道、使用。', '滲':'液體慢慢地透過去。', '限制':'規定或條件所造成的範圍，超過就做不到。', '大打折扣':'效果大大減少。' },
  qs:[
    C('info', '「罐中罐」冰箱的兩個陶罐之間要填入什麼？', ['濕沙', '冰塊', '乾草', '鹽巴'], '第三段：兩個罐子之間填滿濕沙，再蓋上濕布。', '兩個罐子之間填滿濕沙'),
    C('integ', '罐中罐冰箱能降溫，和下列哪一件事的原理相同？', ['流汗後，汗水蒸發讓身體變涼', '在太陽下曬衣服，衣服變熱', '用瓦斯爐把水煮開', '在飲料裡加冰塊'], '兩者都是水蒸發時帶走熱量。', '汗水蒸發，幫身體降溫'),
    C('infer', '下列哪一個地方最適合使用罐中罐冰箱？', ['炎熱又乾燥的地區', '潮濕多雨的熱帶雨林', '寒冷的極地', '常常起霧的海邊'], '第五段：空氣潮濕時不容易蒸發，最適合又熱又乾燥的地區。', '它最適合用在又熱又乾燥的地區'),
    C('infer', '如果忘了每天幫罐中罐冰箱補充水分，最可能發生什麼事？', ['沙子乾了，沒有水可以蒸發，就不能降溫', '罐子裡的溫度會變得更低', '陶罐裡面會結冰', '蔬菜水果會長得更大'], '降溫靠的是水不斷蒸發，沒有水就沒有降溫效果。', '只要每天補充水分'),
    C('eval', '作者用罐中罐冰箱的例子，最想說明什麼？', ['簡單的原理和材料，也能解決生活中的大問題', '電冰箱一點用處也沒有', '奈及利亞的天氣非常炎熱', '陶罐比電冰箱更昂貴'], '最後一段：好的發明，不一定要複雜又昂貴。', '好的發明，不一定要複雜又昂貴')
  ] },
{ id:'s3', lv:6, cat:'sci', icon:'🌙', title:'月亮變臉的祕密',
  p:[
    '有時候月亮圓得像盤子，有時候彎得像眉毛，有時候乾脆躲起來不見了。古人常把月亮的變化想像成神話故事，但其實，月亮從來沒有真的變形。',
    '月亮本身不會發光，我們看到的月光，是月亮反射的太陽光。不論何時，月球總有一半被太陽照亮，另一半是黑暗的。月亮每天繞著地球運行，大約二十九天半繞完一圈。在繞行的過程中，月亮、地球和太陽的相對位置不斷改變，我們從地球上能看到的「亮面」，也就跟著變多或變少。',
    '當月亮跑到地球和太陽之間，亮的那一面背對著我們，我們幾乎看不到月亮，這叫做「新月」。之後，亮面露出得越來越多，從細細彎彎的眉月、半個圓的上弦月，一直到整個亮面都朝向地球的「滿月」。農曆每個月的十五日前後，常常就是滿月。過了滿月，亮面又一天天變少，經過下弦月，再回到新月，重新開始。',
    '很多人以為，月亮缺了一角，是被地球的影子擋住了。其實那是「月食」，要太陽、地球、月亮剛好排成一直線時才會發生，一年只有少數幾次。平常月亮的圓缺變化，跟地球的影子沒有關係。',
    '下次抬頭看月亮時，你可以想一想：今天的月亮，站在太陽和地球的哪個位置呢？'
  ],
  gl:{ '反射':'光碰到物體表面後彈回來。', '運行':'天體按照一定的路線移動。', '相對位置':'兩個以上的東西彼此之間的位置關係。', '新月':'月亮的亮面背對地球，幾乎看不見月亮的時候。', '上弦月':'農曆初七、初八前後，看起來像半個圓的月亮。', '農曆':'依照月亮圓缺變化來訂日期的曆法，初一前後是新月。', '月食':'地球擋在太陽和月亮中間，地球的影子遮住月亮的現象。' },
  qs:[
    C('info', '月亮繞地球一圈大約需要多久？', ['二十九天半', '一天', '七天', '一年'], '第二段：大約二十九天半繞完一圈。', '大約二十九天半繞完一圈'),
    C('info', '我們看到的月光，其實是什麼光？', ['月亮反射的太陽光', '月亮自己發出的光', '地球城市的燈光', '星星照過來的光'], '第二段：月亮本身不會發光，月光是它反射的太陽光。', '我們看到的月光，是月亮反射的太陽光'),
    T('integ', '不論是哪一天，月球都有一半被太陽照亮。', true, '對。月球總有一半被照亮，改變的只是我們從地球看到多少亮面。', '不論何時，月球總有一半被太陽照亮'),
    C('infer', '農曆初一前後，最可能看到什麼樣的月亮？', ['幾乎看不到月亮', '圓圓的滿月', '半個圓的上弦月', '半個圓的下弦月'], '十五日前後是滿月，再過大約半個月（初一前後）就回到看不見的新月。', '這叫做「新月」'),
    C('eval', '小美說：「月亮會變彎，是因為被地球的影子擋住了。」根據文章，這個說法——', ['不正確，平常的圓缺是因為我們看到的亮面多少不同', '正確，月亮每天都被地球的影子擋住', '只有在夏天才正確', '文章裡沒有提到，沒辦法判斷'], '第四段說明：被地球影子遮住的是月食，平常的圓缺跟地球影子無關。', '平常月亮的圓缺變化，跟地球的影子沒有關係')
  ] },

{ id:'f1', lv:6, cat:'fun', icon:'🐈', title:'我家的老闆',
  p:[
    '我們家真正的老闆，不是爸爸，也不是媽媽，而是一隻叫做「饅頭」的橘貓。',
    '每天早上六點整，饅頭會準時跳上爸爸的肚子，用牠四公斤重的身體來回踩踏，好像在檢查床墊夠不夠軟。爸爸哀號著起床倒飼料，饅頭卻只聞了一下，就轉頭走開——這代表今天的早餐「不及格」，必須換一個口味。',
    '媽媽花了兩千元，買了一張號稱「貓咪天堂」的豪華貓床。饅頭看都不看一眼，反而一頭鑽進裝貓床的紙箱裡，舒舒服服地睡了一整個下午。從那天起，那張貓床就成了我的抱枕。',
    '饅頭還有一條奇怪的規定：家裡的門不准關。只要有一扇門關著，牠就坐在門前「喵——喵——」叫個不停；等你幫牠把門打開，牠又只是探頭看一眼，轉身走掉。',
    '最可怕的是我寫功課的時候。只要我一打開作業簿，饅頭就會慢慢走過來，大剌剌地躺在上面，尾巴一甩，把我的鉛筆掃到地上。我只好跟老師解釋：「我不是不寫，是老闆不准我寫。」老師笑了笑，說：「那請你們老闆明天來學校一趟。」',
    '我們全家人都抱怨饅頭很難伺候，可是每天晚上，當牠蜷成一團、在沙發上發出呼嚕呼嚕的聲音時，爸爸會輕手輕腳地幫牠蓋上小毯子，媽媽會偷偷拍下好幾十張照片。',
    '我想，老闆難伺候歸難伺候，我們全家還是心甘情願地替牠打工。'
  ],

{ id:'f2', lv:6, cat:'fun', icon:'📱', title:'阿公學手機',
  p:[
    '阿公七十五歲生日那天，我們送他一支智慧型手機。阿公把手機拿得遠遠的，瞇著眼睛說：「這麼小一塊玻璃，比我的老花眼鏡還難懂。」',
    '我當起了阿公的「手機老師」。第一課是傳訊息。阿公學得很認真，用一根手指，一個字一個字慢慢點，十分鐘後，終於傳出他人生的第一則訊息：「吃飽沒」。可惜他傳到的不是阿嬤，而是爸爸公司的工作群組。隔天，爸爸的老闆回覆：「謝謝關心，吃飽了。」',
    '第二課是貼圖。阿公發現點一下就能送出一張可愛的圖，簡直如獲至寶。從此，家族群組每天早上五點半，準時出現一朵大大的蓮花，旁邊寫著「早安，平安喜樂」，接著是一隻跳舞的熊貓、一碗熱騰騰的稀飯，還有一張不知道為什麼會出現的生日蛋糕——那天明明誰都沒有生日。',
    '第三課是語音訊息。阿公覺得打字太麻煩，乾脆按住按鈕說話。問題是，他每次都對著手機大喊，好像對方住在山的另一頭。有一次，他錄了整整三分鐘，內容是在客廳裡找老花眼鏡，最後才發現眼鏡就戴在自己頭上。',
    '現在，阿公已經是家族群組裡最活躍的成員。雖然他常常傳錯人、按錯圖，但每天早上看到那朵蓮花，我們就知道：阿公今天也很好。'
  ],

{ id:'f3', lv:6, cat:'fun', icon:'👽', title:'完美的理由',
  p:[
    '星期一早上，小傑發現自己忘了寫數學作業。他靈機一動，決定編一個「完美的理由」。',
    '第一個版本是「作業被狗吃掉了」。但他想起來，自己家根本沒有養狗，而且這個理由，老師一定已經聽過一百次了。',
    '第二個版本比較有創意：「昨晚停電，我只好點蠟燭寫作業，結果作業簿被燒掉了。」小傑想了想，又搖搖頭——萬一老師打電話問媽媽昨天有沒有停電，那就完蛋了。',
    '第三個版本最驚人：「昨天晚上，外星人把我抓到太空船上，要我教他們數學。我把作業給他們當課本，他們就帶回火星了。」小傑越想越得意，覺得這個理由不但沒有破綻，還能證明自己的數學很好。',
    '為了讓故事更完整，小傑利用早自習的時間，在筆記本上畫了太空船的設計圖，寫下外星人的名字、身高和最喜歡的食物，還列出他教了哪些題目，一共寫滿了三頁。',
    '第一節上課，老師走到他桌邊。小傑深吸一口氣，正準備開口，老師卻低頭看著那三頁筆記，點點頭說：「寫得真詳細。你花在編故事的時間，應該夠寫完兩次作業了吧？」',
    '全班哄堂大笑，小傑的臉紅得像番茄。那天放學，他乖乖留下來，十分鐘就把作業寫完了。'
  ],

{ id:'l1', lv:6, cat:'lit', icon:'🍳', title:'灶腳的「剛剛好」',
  p:[
    '外婆家的灶腳，是全家最小的房間，卻總是最熱鬧的地方。',
    '小時候，每到過年，我就搬一張矮凳子坐在門邊，看外婆忙碌。她的雙手好像會變魔術：一團白白的糯米糰，在她掌心揉一揉、搓一搓，就變成一顆顆圓滾滾的湯圓；一把青菜丟進鍋裡，「嗤」的一聲，香氣立刻從門縫溜出去，把在客廳看電視的舅舅們全都勾了進來。',
    '外婆做菜從來不用量匙，也不看食譜。我問她鹽要放多少，她總是笑著說：「放到剛剛好就好。」我一直搞不懂，「剛剛好」到底是多少？',
    '每年除夕，外婆會煮滿滿一桌菜。她自己總是最後一個坐下，筷子還沒動幾下，又起身去添湯、盛飯。我問她怎麼不多吃一點，她說：「看你們吃，我就飽了。」',
    '灶腳的牆壁被油煙燻出一層淡淡的黃，像一張褪了色的舊照片。窗台上擺著幾個玻璃罐，裝著外婆自己醃的蘿蔔乾，每一罐都貼著用毛筆寫的日期。外婆說，蘿蔔乾放得越久越香，就像人一樣，要慢慢地熬。',
    '後來，外婆年紀大了，手開始發抖，拿不穩鍋鏟。灶腳的爐火，一天比一天少點燃。',
    '去年冬天，我第一次自己煮了一盤外婆的蘿蔔乾煎蛋。我沒有量匙，也沒有食譜，只是一邊回想，一邊慢慢調味。嚐了一口，我忽然懂了——所謂的「剛剛好」，是把吃飯的人放在心上的那份分寸。'
  ],
  gl:{ '灶腳':'臺語，指廚房。', '糯米糰':'用糯米磨成粉、加水揉成的麵糰，可以做湯圓。', '勾':'吸引、引誘過來。', '食譜':'教人怎麼做菜的說明。', '燻':'被煙長時間薰染。', '醃':'用鹽或糖浸漬食物，讓它可以久放。', '熬':'用小火長時間地煮；也比喻慢慢地經歷、忍耐。', '分寸':'說話做事恰當的程度。' },
  qs:[
    C('info', '作者問鹽要放多少時，外婆怎麼回答？', ['放到剛剛好就好', '放一小匙就好', '照食譜上寫的放', '越多越香'], '第三段：外婆總是笑著說「放到剛剛好就好」。', '放到剛剛好就好'),
    C('integ', '「香氣立刻從門縫溜出去，把……舅舅們全都勾了進來」，這句話用了什麼寫法？', ['擬人：把香氣寫得像人一樣會溜、會勾人', '設問：先提出問題再回答', '排比：用三句相同的句型', '引用：引用古人說過的話'], '「溜出去」「勾進來」原本是人的動作，用在香氣上，就是擬人。', '香氣立刻從門縫溜出去'),
    C('infer', '「灶腳的爐火，一天比一天少點燃」，暗示了什麼？', ['外婆的身體變差，越來越少下廚', '瓦斯變貴了', '家人不喜歡外婆煮的菜', '灶腳準備要拆掉了'], '前一句寫外婆手發抖、拿不穩鍋鏟，所以越來越少煮飯。', '手開始發抖，拿不穩鍋鏟'),
    C('integ', '外婆說蘿蔔乾「就像人一樣，要慢慢地熬」，意思最接近哪一項？', ['人要經過時間和磨練，才會更成熟、更有味道', '人要常常吃蘿蔔乾才會健康', '人做事要越慢越好', '人年紀越大就越不好'], '「熬」有慢慢經歷的意思，外婆用蘿蔔乾比喻人的成長。', '就像人一樣，要慢慢地熬'),
    C('eval', '文章最後，作者理解的「剛剛好」是什麼？', ['心裡想著吃飯的人，用心調出最適合的味道', '用秤量出精準的公克數', '完全照著食譜做', '鹽放得越多越剛好'], '最後一句點出主旨：剛剛好，是把吃飯的人放在心上的分寸。', '是把吃飯的人放在心上的那份分寸')
  ] },
{ id:'l2', lv:6, cat:'lit', icon:'🍉', title:'最大的西瓜',
  p:[
    '山腳下的村子，每年夏天都會舉辦西瓜比賽，誰種出最大的西瓜，誰就能得到一面金色的獎牌。',
    '農夫阿土今年下定決心要拿冠軍。他聽說，只要把一株瓜藤上其他的小瓜通通摘掉，養分就會集中到一顆瓜上。於是，他每天巡視瓜田，看到新冒出來的小西瓜，就狠下心摘掉，只留下最壯的那一顆。',
    '隔壁的阿妹也種西瓜，卻一顆也不摘。她的瓜藤上結滿了大大小小的西瓜，有的像皮球，有的像拳頭。阿土看了直搖頭：「這樣怎麼可能得獎？」',
    '整個夏天，阿土把所有的心力都放在那顆大西瓜上。他替它撐傘遮陽，晚上還睡在田邊守著，深怕被野狗或小偷碰到。看著西瓜一天天長大，他好像已經看見金牌在發亮。',

    '舅舅每天早上都說：「起床囉！」所以阿綠每天天還沒亮，就大聲叫：「起床囉！起床囉！」吵得大家都睡不著。',
    '有一天，門鈴響了，舅媽趕快跑去開門，門外卻一個人也沒有。原來，是阿綠在學門鈴的聲音！',

  p:[

    '大樹說：「別急，先把根往土裡伸得深一點。」',
    '小樹覺得往下長太慢了，它只想往上長，好看見遠方的風景。',

    '從那天起，小樹不再急著長高，它每天都把根往土裡多伸一點點。'

    st.x += speed * st.dir;
    if (st.x < 4){ st.x = 4; st.dir = 1; } if (st.x > W - S2 - 4){ st.x = W - S2 - 4; st.dir = -1; }

    fP(g, -4, 0, '#141a3a', W + 8, H);
    for (let y = 0; y < GY; y += 4) fP(g, -4, y, `rgba(${rgb},${.04 + y / H * .22})`, W + 8, 4);
    stars.forEach(s => { if ((st.t + s.x) % 70 < 58) fP(g, s.x, s.y, s.k ? '#ffffff' : '#ffcf3f', 1, 1); });
    fP(g, -4, GY, '#2a3370', W + 8, H - GY); fP(g, -4, GY, color, W + 8, 1);
    for (let x = 0; x < W; x += 12) fP(g, x + 3, GY + 3, '#343e86', 5, 1);
    fP(g, Math.round(st.x + 4), GY - 1, 'rgba(0,0,0,.4)', S2 - 8, 2);
    if (bg) bg();
    g.save(); g.translate(Math.round(cx()), Math.round(GY - PH / 2 + h)); g.rotate(rot); g.scale(sx * (st.dir > 0 ? -1 : 1), sy);
    g.drawImage(img, -S2 / 2, -PH / 2, S2, PH); g.restore();
    if (fx) fx();
    st.parts = st.parts.filter(p => {
      p.x += p.vx; p.y += p.vy; if (p.sh === 'dot') p.vy += .08; if (p.sh === 'z'){ p.vy = -.25; p.vx = .15; } if (p.sh === 'steam'){ p.vy = -.3; p.vx = Math.sin(p.t / 5) * .3; } p.t--;
      if (p.sh === 'heart') heart(Math.round(p.x), Math.round(p.y), p.c);
      else if (p.sh === 'drop'){ fP(g, Math.round(p.x), Math.round(p.y), p.c, 2, 3); fP(g, Math.round(p.x), Math.round(p.y) - 1, p.c, 1, 1); }
      else if (p.sh === 'z') glyph('z', Math.round(p.x), Math.round(p.y));
      else if (p.sh === 'steam') fP(g, Math.round(p.x), Math.round(p.y), `rgba(232,232,248,${Math.min(1, p.t / 30)})`, 1, 2);
      else fP(g, Math.round(p.x), Math.round(p.y), p.c, 2, 2);

    });
    g.restore();
    requestAnimationFrame(frame);
  }

  st.sad = () => { st.mode = 'sad'; st.mt = 90; st.mem = {}; };
  requestAnimationFrame(frame);
  return st;
}

function confetti(){
  const cv = document.createElement('canvas'); cv.className = 'confetti'; cv.width = innerWidth; cv.height = innerHeight;
  document.body.appendChild(cv);
  const g = cv.getContext('2d'), cols = ['#ffcf3f', '#ff5fa2', '#3ce0ff', '#3ccf6e', '#c48bff', '#ff6b6b'];
  const ps = Array.from({ length:160 }, () => ({ x:Math.random() * cv.width, y:-Math.random() * cv.height * .5, vx:(Math.random() - .5) * 2, vy:2 + Math.random() * 3, s:4 + Math.random() * 6, c:cols[Math.floor(Math.random() * cols.length)], r:Math.random() * 6, vr:(Math.random() - .5) * .3 }));
  let t = 0;
  (function step(){
    t++; g.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx + Math.sin((t + p.r * 20) / 20); p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
    if (t < 220) requestAnimationFrame(step); else cv.remove();
  })();
}

// 注音資料 ZY 是事先查教育部國語辭典產生的：{ 原文: '每個國字的注音，用空白分開' }
const NOSTART = '，。、；：！？」』）…—';
const HAN = /[㐀-鿿豈-﫿]/;
// 一個字的直式注音：輕聲點在最上面，聲調在最後一個符號的右上方（注音符號用 span，不會被其他 b 的樣式影響）
function ruby(ch, s){
  const dot = s.startsWith('˙'), body = s.replace('˙', ''), tone = /[ˊˇˋ]$/.test(body) ? body.slice(-1) : '', letters = [...(tone ? body.slice(0, -1) : body)];
  return `<span class="ru"><span class="hz">${esc(ch)}</span><span class="sy${letters.length > 1 ? ' m' : ''}"><span class="col">${dot ? '<i class="dot">˙</i>' : ''}${letters.map((c, i) => `<span class="zl">${c}${tone && i === letters.length - 1 ? `<i class="tn">${tone}</i>` : ''}</span>`).join('')}</span></span></span>`;
}
// 現在要不要顯示注音：正在讀的文章有注音，或是在 Lv1、Lv2 的畫面
const useZy = () => R ? !!R.a.zy : S.lv <= 2;
// 把一段文字拆成一個字一個 HTML（有注音的國字變成直式注音）
function zyToks(text, force = false){
  const chars = [...String(text)], sy = (force || useZy()) && ZY[text];
  if (!sy) return chars.map(esc);
  const syl = sy.split(' '); let k = 0;
  // 句號、逗號、引號的後半等不放在行首：把它併進前一個字，包成不會斷開的一組（那一格留空，字的位置編號不變）
  const out = [], grp = new Set();
  chars.forEach(c => {
    if (HAN.test(c) && syl[k]){ out.push(ruby(c, syl[k++])); return; }
    if (NOSTART.includes(c)){ let j = out.length - 1; while (j >= 0 && out[j] === '') j--; if (j >= 0){ out[j] += esc(c); grp.add(j); out.push(''); return; } }
    out.push(esc(c));
  });
  return out.map((t, i) => grp.has(i) ? `<span class="nb">${t}</span>` : t);
}
const Z = text => zyToks(text).join('');              // 依目前的等級決定要不要加注音
const ZF = text => zyToks(text, true).join('');       // 一定加注音（例如第一次打開時問年級）
// 在拆好的字上加標記（生詞底線、線索句、強調）；ranges 是 { s, e, a, b }：從第 s 個字到第 e 個字前面，包上 a…b
function wrapToks(toks, ranges){
  const open = {}, close = {};
  ranges.slice().sort((x, y) => (y.e - y.s) - (x.e - x.s)).forEach(r => { (open[r.s] = open[r.s] || []).push(r.a); (close[r.e - 1] = close[r.e - 1] || []).unshift(r.b); });
  return toks.map((t, i) => (open[i] || []).join('') + t + (close[i] || []).join('')).join('');

// ---------- 原文：生詞加上底線（每個生詞只標第一次出現），可以再標出「線索句」 ----------
function artHtml(a, mark = null){
  const keys = Object.keys(a.gl).sort((x, y) => y.length - x.length), used = new Set();
  return a.p.map((p, i) => {
    const k = mark ? p.indexOf(mark) : -1, ev = k < 0 ? null : { s:k, e:k + mark.length };
    const taken = [], rs = [];
    for (const w of keys){
      if (used.has(w)) continue;
      let j = p.indexOf(w);
      while (j >= 0 && taken.slice(j, j + w.length).some(Boolean)) j = p.indexOf(w, j + 1);
      if (j < 0) continue;
      if (ev && j < ev.e && j + w.length > ev.s && !(j >= ev.s && j + w.length <= ev.e)) continue;   // 跨在線索句邊上的生詞就不標，標記才不會交錯
      used.add(w); for (let t = j; t < j + w.length; t++) taken[t] = true;
      rs.push({ s:j, e:j + w.length, a:`<span class="gw" tabindex="0" role="button" data-g="${w}">`, b:'</span>' });
    }
    if (ev) rs.push({ ...ev, a:'<mark class="ev" id="evMark">', b:'</mark>' });
    return `<p data-p="${i}">${wrapToks(zyToks(p), rs)}</p>`;
  }).join('');
}
// 題目裡的「不是」「不包括」「不」加上強調
function qHtml(t){
  const rs = [], re = /「不是」|「不包括」|「不」/g; let m;
  while ((m = re.exec(t))) rs.push({ s:m.index, e:m.index + m[0].length, a:'<em>', b:'</em>' });
  return wrapToks(zyToks(t), rs);
}

const mmss = s => s >= 60 ? `${Math.floor(s / 60)} 分 ${s % 60} 秒` : `${s} 秒`;
function result(){
  const a = R.a, n = a.qs.length, ok = R.res.filter(r => r === 'ok').length, rate = ok / n;

function wordbook(){
  R = null; if (SCENE) SCENE.alive = false; tipHide();
  const ws = Object.entries(S.words || {});
  $('view').innerHTML = `<div class="wrap dex">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">📒 生詞本 <span style="font-family:var(--px);font-size:12px;color:var(--gold)">${ws.length}</span></h2><button class="btn alt" id="back">◀ 回主畫面</button></div>
    <p class="tipline" style="text-align:left">讀文章時查過的字詞，都會收進生詞本，可以隨時回來複習。</p>
    ${ws.length ? `<div class="cards">${ws.map(([w, o]) => `<div class="card" style="--c:var(--cyan)"><div><b>${esc(w)}</b>${esc(o.m)}<div class="from">出自《${esc(o.from)}》</div></div></div>`).join('')}</div>` : '<p class="tipline">還沒有查過生詞。讀文章時，點一下有底線的字詞就會收進來喔！</p>'}
  </div>`;
  $('back').onclick = home;
  syncZyBtn(); SFX.page();
}
function help(){
  $('modal').innerHTML = `<div class="help" role="dialog"><h3>❓ 怎麼玩</h3><ul>
    <li>閱讀等級 Lv1～Lv6 對應一到六年級，第一次打開時會依你的年級設定；點標題「閱讀 Lv ▾」可以隨時換等級。目前開放 Lv1、Lv2、Lv6。</li>
    <li>Lv1、Lv2 的文章、題目和選項都有注音；想練習不看注音，可以按上方的「ㄅ 注音」關掉。</li>
    <li>選一個喜歡的主題（自然、科學、搞笑、文學），再挑一篇文章開始讀。</li>
    <li>有底線的字詞，滑過去或點一下，旁邊就會出現解釋；查過的詞會收進「📒 生詞本」。</li>
    <li>讀完按「我讀完了」，原文會縮到一半，另一半出閱讀理解題（Lv1 每篇 3 題、Lv2 每篇 4 題、Lv6 每篇 5 題）；答題時可以隨時回原文找答案。</li>
    <li>卡關時按「🔍 回原文找線索」，會標出答案在哪一段（XP 少一點）。答完每一題，原文裡的線索句會用黃色標出來。</li>
    <li>答對拿 XP，小夥伴會開心地跑來跑去；連續答對有 COMBO，全部答對再加 100 XP。</li>
    <li>🏆 排行榜依等級分開：Lv6 的成績只和 Lv6 比。有四種排行：星星總數、累積答對題數、讀完篇數、經驗值。讀完一篇後如果擠進前 ${LB_SHOW} 名，就能輸入名字登上排行榜！</li></ul>
    <h3>給家長和老師</h3><p style="margin:0 0 10px">文章和題目全部是原創撰寫：Lv1 有 ${lvArts(1).length} 篇（每篇約 ${lvChars(1)} 字），Lv2 有 ${lvArts(2).length} 篇（約 ${lvChars(2)} 字），Lv6 有 ${lvArts(6).length} 篇（約 ${lvChars(6)} 字）。Lv1、Lv2 的注音依教育部《重編國語辭典修訂本》標注，「一」「不」標本調。題目依閱讀理解的四種能力設計：找資訊（直接從文中找答案）、推論（從線索推想沒有明說的事）、整合詮釋（把多處訊息連起來、理解寫法和含意）、評估反思（判斷主旨、目的和觀點）。紀錄只存在這台裝置的瀏覽器裡。</p>
    <div class="row"><button class="btn" id="hclose">我知道了</button><button class="btn alt" id="reset">清除紀錄</button></div></div>`;
  $('modal').hidden = false;
  $('hclose').onclick = closeModal;
  $('reset').onclick = e => { const b = e.currentTarget; if (!b.dataset.sure){ b.dataset.sure = 1; b.textContent = '⚠️ 再按一次確定清除'; return; } S = { xp:0, arts:{}, words:{}, correct:0, lvst:{}, lv:S.lv, grade:S.grade, pet:S.pet, uid:S.uid, fbRefresh:S.fbRefresh, name:S.name }; save(); closeModal(); home(); };
}
function closeModal(){ if ($('modal').dataset.lock) return; $('modal').hidden = true; }

// ---------- 事件 ----------
$('view').addEventListener('change', e => { if (e.target.id === 'lvSel'){ S.lv = +e.target.value; save(); SFX.blip(); home(); } });
$('view').addEventListener('click', e => {
  audio();
  const gw = e.target.closest('.gw');
  if (gw){ if (TIP_EL === gw && TIP_PIN) tipHide(); else { tipShow(gw, true); SFX.blip(); } return; }
  const ps = e.target.closest('[data-pscroll]');
  if (ps){ const row = $('petRow'); row.scrollBy({ left:+ps.dataset.pscroll * Math.max(80, row.clientWidth * .7), behavior:'smooth' }); SFX.blip(); return; }
  const pt = e.target.closest('[data-pet]');
  if (pt){ S.pet = pt.dataset.pet; save(); SFX.blip(); $('view').querySelectorAll('[data-pet]').forEach(b => { const on = b === pt; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); }); if (SCENE){ SCENE.alive = false; SCENE = startScene($('heroCv'), '#3ce0ff', 40); SCENE.happy(); } return; }
  if (e.target.closest('#lvSel')) return;
  const lv = e.target.closest('[data-lv]'); if (lv){ S.lv = +lv.dataset.lv; save(); SFX.blip(); home(); return; }
  const ct = e.target.closest('[data-cat]'); if (ct){ catView(ct.dataset.cat); return; }
  const ar = e.target.closest('[data-art]'); if (ar){ startRead(ar.dataset.art); return; }
  const rd = e.target.closest('[data-rand]');
  if (rd){ const as = catArts(S.lv, rd.dataset.rand), fresh = as.filter(a => !artDone(a)); startRead(shuffle((fresh.length ? fresh : as).slice())[0].id); return; }
  if (!R || R.phase !== 'quiz' || R.done) return;
  const q = R.a.qs[R.i];
  const op = e.target.closest('[data-a]');
  if (op){
    const a = +op.dataset.a, isRight = v => q.type === 'tf' ? (v === 1) === q.a : v === 0, ok = isRight(a);
    $('quiz').querySelectorAll('[data-a]').forEach(b => { b.disabled = true; const v = +b.dataset.a; if (isRight(v)) b.classList.add('ok'); else if (b === op) b.classList.add('no'); else b.classList.add('dim'); });
    answer(ok); return;
  }
  const oc = e.target.closest('[data-o]');
  if (oc){
    R.picked.push(+oc.dataset.o); SFX.blip(); drawOrder();
    if (R.picked.length === q.items.length){
      const ok = R.picked.every((k, n) => k === n);
      $('line').querySelectorAll('.chipq').forEach((c, n) => c.classList.add(R.picked[n] === n ? 'ok' : 'no'));
      answer(ok);
    }
    return;
  }
  if (e.target.closest('#undo')){ R.picked.pop(); SFX.blip(); drawOrder(); }
});
// 滑鼠滑過就顯示，移開就收起（點過的會固定住，直到點別的地方）
$('view').addEventListener('mouseover', e => { const gw = e.target.closest('.gw'); if (gw && !TIP_PIN && matchMedia('(hover:hover)').matches) tipShow(gw, false); });
$('view').addEventListener('mouseout', e => { const gw = e.target.closest('.gw'); if (gw && !TIP_PIN && TIP_EL === gw) tipHide(); });
$('view').addEventListener('focusin', e => { const gw = e.target.closest('.gw'); if (gw) tipShow(gw, false); });
$('view').addEventListener('focusout', e => { if (e.target.closest('.gw') && !TIP_PIN) tipHide(); });
document.addEventListener('click', e => { if (TIP_EL && !e.target.closest('.gw') && !e.target.closest('#gtip')) tipHide(); });
document.addEventListener('scroll', () => { if (TIP_EL) tipHide(); }, true);
addEventListener('resize', () => { if (TIP_EL) tipHide(); });
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
addEventListener('keydown', e => {
  if (!$('modal').hidden){ if (e.key === 'Escape') closeModal(); return; }
  if (e.key === 'Escape') tipHide();
  if (e.key === 'Enter' && document.activeElement && document.activeElement.classList.contains('gw')){ e.preventDefault(); document.activeElement.click(); return; }
  if (R && R.phase === 'quiz' && !R.done && /^[1-4]$/.test(e.key)){ const b = $('quiz').querySelectorAll('[data-a]')[+e.key - 1]; if (b) b.click(); }
  if (R && R.phase === 'quiz' && R.done && e.key === 'Enter' && $('next')){ e.preventDefault(); $('next').click(); }
});
$('btnHome').onclick = () => { if ($('modal').dataset.lock) return; audio(); closeModal(); home(); };
$('btnWords').onclick = () => { if ($('modal').dataset.lock) return; audio(); closeModal(); wordbook(); };
$('btnRank').onclick = () => { if ($('modal').dataset.lock) return; audio(); showBoard('stars', S.lv); };
$('btnHelp').onclick = () => { if ($('modal').dataset.lock) return; audio(); help(); };
$('btnZy').onclick = () => { S.zyOff = !S.zyOff; save(); syncZyBtn(); tipHide(); SFX.blip(); };
$('btnSnd').onclick = () => { muted = !muted; $('btnSnd').setAttribute('aria-pressed', String(!muted)); if (!muted) SFX.blip(); };
home();
</script>
</body>
</html>
